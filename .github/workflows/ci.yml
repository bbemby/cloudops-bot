name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送取消旧任务，节省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试
        # 单元测试 + 集成测试（含子进程方式的 CLI 冒烟）
        run: python -m unittest discover -s tests -v

      - name: 启动前体检
        # 不需要真实 Telegram Token：只用假 Token 验证
        # “配置齐全 → 建库 → 退出码 0” 这条链路。SECRET_KEY 现场生成，不入库。
        env:
          TELEGRAM_BOT_TOKEN: "123456:CI-DUMMY-TOKEN"
          BOT_ADMIN_IDS: "100000001"
          DATABASE_PATH: ./data/ci.db
          ENABLE_MOCK_PROVIDER: "true"
        run: |
          export SECRET_KEY="$(python manage.py gen-secret | head -n 1)"
          python main.py --check
          python manage.py doctor

      - name: 启动失败也要给人话（无堆栈、无连接泄漏）
        env:
          TELEGRAM_BOT_TOKEN: "123456:CI-DUMMY-TOKEN"
          BOT_ADMIN_IDS: "100000001"
          SECRET_KEY: "ci-only-not-a-real-key"
          DATABASE_PATH: ./data/ci2.db
          TELEGRAM_API_BASE: "http://127.0.0.1:9"
          TELEGRAM_RETRIES: "0"
          TELEGRAM_REQUEST_TIMEOUT: "2"
        run: |
          python main.py > out.log 2>&1 || true
          grep -q "启动失败" out.log
          ! grep -q "Traceback" out.log
          ! grep -q "Unclosed client session" out.log

  lint:
    name: 静态检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check cloudops tests deploy main.py manage.py
